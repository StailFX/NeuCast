<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#10b981" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="512"/>
    <line x1="160" y1="0" x2="160" y2="512"/>
    <line x1="240" y1="0" x2="240" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="400" y1="0" x2="400" y2="512"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
  </g>

  <!-- Chart line (main trend) -->
  <polyline
    points="80,340 130,320 170,335 210,290 250,310 280,250 310,270 340,200 370,220 400,160 430,180"
    fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glow area under chart -->
  <polygon
    points="80,340 130,320 170,335 210,290 250,310 280,250 310,270 340,200 370,220 400,160 430,180 430,400 80,400"
    fill="url(#glow)"/>

  <!-- Data points -->
  <circle cx="210" cy="290" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="280" cy="250" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="340" cy="200" r="6" fill="#3b82f6" opacity="0.8"/>
  <circle cx="400" cy="160" r="8" fill="#10b981">
    <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Prediction dashed line -->
  <line x1="400" y1="160" x2="430" y2="180" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8,6" stroke-linecap="round" opacity="0.7"/>
  <circle cx="430" cy="180" r="5" fill="#f59e0b" opacity="0.7"/>

  <!-- "N" logo mark -->
  <g transform="translate(168, 90)">
    <rect width="176" height="50" rx="12" fill="url(#accent)" opacity="0.15"/>
    <text x="88" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="white" letter-spacing="3">NEUCAST</text>
  </g>

  <!-- AI badge -->
  <g transform="translate(340, 90)">
    <rect width="40" height="22" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="20" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">AI</text>
  </g>
</svg>
