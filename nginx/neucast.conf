# ──────────────────────────────────────────────────────────────
# NeuCast Nginx config
#   - HTTP/2 + TLS (отдельным server-block'ом, если есть сертификат)
#   - gzip (на фронтенд-трафик: HTML/JSON/JS/CSS/SVG)
#   - aggressive caching на /static/ (1 год, immutable)
#   - быстрые proxy-заголовки на приложение
# ──────────────────────────────────────────────────────────────

upstream neucast_app {
    server app:8100;
    keepalive 32;
}

# ──────────────────────────────────────────────────────────────
# Code-review C-3 (2026-05-04): rate-limit zones for brute-force-prone
# endpoints. Zones must be declared in the http {} context (i.e. here,
# above any server {} block).
#
# `login_zone`: 5 req/min per source IP. Login form gets ``limit_req``
# at burst=10 nodelay, so legitimate users with sticky-Caps-Lock get a
# few retries free; bots making 100+ attempts/sec get 429'd.
#
# `api_zone`: 10 req/sec per IP, applied to /api/highfreq/*. Dashboard
# JS does ~5 req per 30 s window per card — well under cap. Bots
# scraping every endpoint at full speed get throttled.
# ──────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_status 429;

# ── gzip (глобально для сервера) ─────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/ld+json
    application/manifest+json
    image/svg+xml
    font/woff2;

# ── Основной сервер (HTTP → редирект на HTTPS, если есть TLS) ─
server {
    listen 80;
    listen [::]:80;
    server_name neucast.ru www.neucast.ru;

    # ACME challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Если есть TLS-сертификат — раскомментировать этот блок:
    # return 301 https://$host$request_uri;

    # Если нет TLS — приложение проксируется напрямую (dev/standalone)
    location /static/ {
        proxy_pass http://neucast_app;
        # Статика: год кэша с immutable (безопасно, т.к. favicon-* имена уникальные)
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # HTML-страницы — короткий кэш, чтобы пользователь мог увидеть обновления
    location = / {
        proxy_pass http://neucast_app;
        include /etc/nginx/conf.d/_neucast_proxy.inc;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Code-review C-3: rate-limit /login (POST + GET both go here in
    # current routing). 5 req/min per IP with burst=10 nodelay — humans
    # with sticky CapsLock get a few free retries; brute-force bots
    # get 429s.
    location = /login {
        limit_req zone=login_zone burst=10 nodelay;
        proxy_pass http://neucast_app;
        include /etc/nginx/conf.d/_neucast_proxy.inc;
    }

    # Code-review C-3: per-IP rate-limit on the public HF API surface.
    # Dashboard JS sustains ~5 req/30 s per card — well under cap.
    location ^~ /api/highfreq/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://neucast_app;
        include /etc/nginx/conf.d/_neucast_proxy.inc;
    }

    location / {
        proxy_pass http://neucast_app;
        include /etc/nginx/conf.d/_neucast_proxy.inc;
    }

    # WebSocket endpoint (прогресс предсказания)
    location /ws/ {
        proxy_pass http://neucast_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;      # долгие WS для прогнозов
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

