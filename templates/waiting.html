<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuCast — Расчёт прогноза...</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png"><link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png"><link rel="apple-touch-icon" href="/static/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0a0e17;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
      pointer-events: none;
    }

    .waiting-container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 500px;
      padding: 3rem 2rem;
    }

    .spinner {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      position: relative;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border: 3px solid transparent;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }

    .spinner-ring:nth-child(1) {
      border-top-color: #10b981;
      animation-duration: 1.5s;
    }

    .spinner-ring:nth-child(2) {
      inset: 8px;
      border-right-color: #3b82f6;
      animation-duration: 2s;
      animation-direction: reverse;
    }

    .spinner-ring:nth-child(3) {
      inset: 16px;
      border-bottom-color: #8b5cf6;
      animation-duration: 1s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pulse-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.5); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .status-text {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      min-height: 1.5em;
      transition: opacity 0.3s;
    }

    .ticker-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .progress-steps {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
      margin: 2rem 0;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.3);
      font-size: 0.9rem;
      color: #64748b;
      transition: all 0.3s;
    }

    .step.active {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.05);
      color: #e2e8f0;
    }

    .step.done {
      border-color: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .step-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
      border: 2px solid #334155;
      transition: all 0.3s;
    }

    .step.active .step-icon {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.2);
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 4px rgba(16, 185, 129, 0.3); }
      50% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.6); }
    }

    .step.done .step-icon {
      border-color: #10b981;
      background: #10b981;
      color: #0a0e17;
    }

    .error-msg {
      color: #ef4444;
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      display: none;
    }

    .time-elapsed {
      color: #475569;
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    .tg-notify {
      margin-top: 1.5rem;
    }

    .tg-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(0, 136, 204, 0.1);
      border: 1px solid rgba(0, 136, 204, 0.3);
      border-radius: 8px;
      color: #0088cc;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .tg-btn:hover {
      background: rgba(0, 136, 204, 0.2);
      border-color: rgba(0, 136, 204, 0.5);
    }

    .tg-btn svg {
      width: 18px;
      height: 18px;
      fill: #0088cc;
    }

    .tg-btn.linked {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: #10b981;
      cursor: default;
    }

    .tg-btn.linked svg {
      fill: #10b981;
    }

    .tg-hint {
      font-size: 0.72rem;
      color: #475569;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="waiting-container">
    <div class="spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="pulse-dot"></div>
    </div>

    <h1>NeuCast</h1>
    <div class="ticker-badge">{{ ticker }}</div>
    <p class="status-text" id="statusText">Подключение...</p>

    <div class="progress-steps">
      <div class="step" id="step-queue">
        <div class="step-icon">1</div>
        <span>Задача в очереди</span>
      </div>
      <div class="step" id="step-fetch">
        <div class="step-icon">2</div>
        <span>Загрузка данных с Yahoo Finance</span>
      </div>
      <div class="step" id="step-predict">
        <div class="step-icon">3</div>
        <span>TCN + CatBoost + XGBoost + LightGBM</span>
      </div>
      <div class="step" id="step-done">
        <div class="step-icon">4</div>
        <span>Готово</span>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="time-elapsed" id="timeElapsed"></div>

    <div class="tg-notify" id="tgNotify" style="display:none;">
      <button class="tg-btn" id="tgBtn" onclick="linkTelegram()">
        <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        <span>Уведомить в Telegram</span>
      </button>
      <div class="tg-hint" id="tgHint">Получите уведомление когда прогноз будет готов</div>
    </div>
  </div>

  <script>
    const taskId = "{{ task_id }}";
    const storageKey = `neucast_start_${taskId}`;
    const saved = sessionStorage.getItem(storageKey);
    const startTime = saved ? parseInt(saved) : Date.now();
    if (!saved) sessionStorage.setItem(storageKey, startTime);
    let pollInterval = null;
    let wsConnected = false;

    function setStep(activeStep) {
      const steps = ['queue', 'fetch', 'predict', 'done'];
      const idx = steps.indexOf(activeStep);
      steps.forEach((s, i) => {
        const el = document.getElementById('step-' + s);
        el.classList.remove('active', 'done');
        if (i < idx) el.classList.add('done');
        else if (i === idx) el.classList.add('active');
      });
    }

    function updateTime() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const min = Math.floor(elapsed / 60);
      const sec = elapsed % 60;
      document.getElementById('timeElapsed').textContent =
        min > 0 ? `${min} мин ${sec} сек` : `${sec} сек`;
    }

    function handleUpdate(data) {
      document.getElementById('statusText').textContent = data.status || data.state;

      if (data.state === 'PENDING') {
        setStep('queue');
      } else if (data.state === 'FETCHING') {
        setStep('fetch');
      } else if (data.state === 'PREDICTING') {
        setStep('predict');
      } else if (data.state === 'SUCCESS') {
        setStep('done');
        document.getElementById('statusText').textContent = 'Перенаправление...';
        if (pollInterval) clearInterval(pollInterval);
        sessionStorage.removeItem(storageKey);
        window.location.href = `/predict/result/${taskId}`;
        return true; // done
      } else if (data.state === 'FAILURE') {
        if (pollInterval) clearInterval(pollInterval);
        document.getElementById('statusText').textContent = 'Ошибка';
        const errEl = document.getElementById('errorMsg');
        errEl.textContent = data.error || 'Неизвестная ошибка';
        errEl.style.display = 'block';
        return true; // done
      }
      return false;
    }

    // ── WebSocket (primary) ──
    function connectWebSocket() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws/task/${taskId}`);

      ws.onopen = () => {
        wsConnected = true;
        // Kill polling if it was running as fallback
        if (pollInterval) {
          clearInterval(pollInterval);
          pollInterval = null;
        }
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleUpdate(data);
        } catch(e) {}
        updateTime();
      };

      ws.onerror = () => {
        // WebSocket failed — fall back to polling
        if (!wsConnected) startPolling();
      };

      ws.onclose = () => {
        wsConnected = false;
        // If closed unexpectedly (not because task finished), fallback to polling
        if (!document.getElementById('errorMsg').style.display &&
            document.getElementById('statusText').textContent !== 'Перенаправление...') {
          startPolling();
        }
      };
    }

    // ── HTTP Polling (fallback) ──
    async function pollStatus() {
      try {
        const res = await fetch(`/api/task/${taskId}`);
        const data = await res.json();
        handleUpdate(data);
      } catch (e) {}
      updateTime();
    }

    function startPolling() {
      if (pollInterval) return; // already polling
      pollStatus();
      pollInterval = setInterval(pollStatus, 1500);
    }

    // ── Init ──
    setStep('queue');
    setInterval(updateTime, 1000);
    connectWebSocket();

    // Telegram integration
    async function checkTelegram() {
      try {
        const res = await fetch('/api/telegram/status');
        const data = await res.json();
        if (data.configured) {
          document.getElementById('tgNotify').style.display = 'block';
          if (data.linked) {
            const btn = document.getElementById('tgBtn');
            btn.classList.add('linked');
            btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#10b981"/></svg><span>Telegram привязан</span>';
            btn.onclick = null;
            document.getElementById('tgHint').textContent = 'Уведомление придёт автоматически';
          }
        }
      } catch(e) {}
    }

    async function linkTelegram() {
      try {
        const res = await fetch('/api/telegram/link');
        const data = await res.json();
        if (data.ok && data.url) {
          window.open(data.url, '_blank');
          document.getElementById('tgHint').textContent = 'Нажмите Start в Telegram, затем вернитесь сюда';
          // Poll for link completion
          const linkPoll = setInterval(async () => {
            const s = await fetch('/api/telegram/status');
            const st = await s.json();
            if (st.linked) {
              clearInterval(linkPoll);
              const btn = document.getElementById('tgBtn');
              btn.classList.add('linked');
              btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#10b981"/></svg><span>Telegram привязан</span>';
              btn.onclick = null;
              document.getElementById('tgHint').textContent = 'Уведомление придёт автоматически';
            }
          }, 2000);
        }
      } catch(e) {}
    }

    checkTelegram();
  </script>

  {% include "_metrika.html" %}
</body>
</html>
