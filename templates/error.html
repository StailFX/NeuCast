<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuCast — {{ status_code }} {{ title }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/favicon-192.png">
  <meta name="robots" content="noindex">

  <link rel="preload" as="font" type="font/woff2" crossorigin fetchpriority="high" href="/static/fonts/inter-latin-700.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/inter-latin-400.woff2">

  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('/static/fonts/inter-latin-400.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap;
      src: url('/static/fonts/inter-latin-500.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap;
      src: url('/static/fonts/inter-latin-600.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap;
      src: url('/static/fonts/inter-latin-700.woff2') format('woff2'); }
    @font-face { font-family: 'Inter-fallback'; src: local('Arial'), local('Helvetica'), local('sans-serif');
      size-adjust: 107%; ascent-override: 90%; descent-override: 22%; line-gap-override: 0%; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Те же токены, что и landing.html / highfreq.html. */
    :root {
      --green: #10b981;
      --green-dark: #059669;
      --blue: #3b82f6;
      --bg: #060a13;
      --border: rgba(51, 65, 85, 0.35);
      --text: #e2e8f0;
      --text-dim: #b8c4d6;
    }

    body {
      font-family: 'Inter', 'Inter-fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 420px; height: 420px;
      background: rgba(16, 185, 129, 0.07);
      top: -120px; left: -80px;
    }
    .orb-2 {
      width: 360px; height: 360px;
      background: rgba(59, 130, 246, 0.06);
      top: 40%; right: -100px;
    }
    @media (max-width: 640px) {
      .orb { display: none; }
    }

    /* ─── Navbar (1:1 с landing.html / highfreq.html) ─── */
    .nav {
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
      background: rgba(6, 10, 19, 0.85);
      border-bottom: 1px solid var(--border);
    }
    @supports (backdrop-filter: blur(1px)) {
      @media (min-width: 769px) {
        .nav { backdrop-filter: blur(24px); background: rgba(6, 10, 19, 0.6); }
      }
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }
    .nav-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--green), var(--blue));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
      transition: transform 0.3s;
    }
    .nav-brand:hover .nav-logo { transform: rotate(-5deg) scale(1.05); }
    .nav-logo svg { width: 18px; height: 18px; fill: white; }
    .nav-name { font-size: 1.2rem; font-weight: 700; color: #f1f5f9; letter-spacing: -0.01em; }

    .nav-links { display: flex; gap: 0.75rem; align-items: center; }
    .nav-btn {
      padding: 0.5rem 1.1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .nav-btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-dim);
    }
    .nav-btn-ghost:hover {
      color: #f1f5f9;
      border-color: rgba(59, 130, 246, 0.4);
      background: rgba(59, 130, 246, 0.05);
    }
    .nav-btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
    }
    .nav-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 24px rgba(16, 185, 129, 0.35);
    }

    @media (max-width: 768px) {
      .nav { padding: 0.85rem 1.25rem; }
      .nav-name { font-size: 1rem; }
    }

    /* ─── Error content ─── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .wrap {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .code {
      font-family: 'Inter', 'Inter-fallback', sans-serif;
      font-size: clamp(64px, 11vw, 96px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    .description {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin: 0 auto 28px;
      max-width: 400px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Те же кнопки, что в навбаре — единый язык. */
    .actions .nav-btn {
      padding: 0.65rem 1.4rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <nav class="nav" aria-label="Main navigation">
    <a href="/" class="nav-brand">
      <div class="nav-logo">
        <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
      </div>
      <span class="nav-name">NeuCast</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-btn nav-btn-ghost">На главную</a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <div class="code">{{ status_code }}</div>
      <h1>{{ title }}</h1>
      <p class="description">{{ description }}</p>
      <div class="actions">
        <a class="nav-btn nav-btn-primary" href="/">На главную</a>
        <a class="nav-btn nav-btn-ghost" href="javascript:history.back()">Назад</a>
      </div>
    </div>
  </main>
</body>
</html>
